<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>Teleprompter</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #101316;
                --panel: #1b2024;
                --line: #374048;
                --text: #f3f5f5;
                --muted: #bbc4ca;
                --accent: #6ee3bd;
                --danger: #ff7979;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                min-height: 100%;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
            }
            button,
            input,
            textarea,
            select {
                font: inherit;
            }
            button {
                cursor: pointer;
                min-height: 44px;
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 8px 14px;
                background: #2b343a;
                color: var(--text);
            }
            button:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            button:focus-visible,
            input:focus-visible,
            textarea:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
            .primary {
                background: var(--accent);
                color: #08291f;
                border-color: var(--accent);
                font-weight: 700;
            }
            .danger {
                background: #862c32;
                color: #fff;
            }
            .screen {
                display: none;
            }
            .screen.active {
                display: block;
            }
            .editor,
            .result {
                max-width: 760px;
                margin: auto;
                padding: 24px 18px 48px;
            }
            .editor h1,
            .result h1 {
                font-size: 1.65rem;
                margin: 0 0 8px;
            }
            p {
                line-height: 1.5;
                color: var(--muted);
            }
            textarea {
                display: block;
                width: 100%;
                min-height: 220px;
                padding: 16px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--panel);
                color: var(--text);
                font-size: 16px;
                resize: vertical;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
                gap: 16px;
                margin: 22px 0;
            }
            .setting {
                display: grid;
                gap: 8px;
                color: var(--muted);
                font-size: 0.94rem;
            }
            .setting input[type="range"] {
                width: 100%;
                accent-color: var(--accent);
            }
            .setting select {
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--line);
                padding: 10px;
                border-radius: 8px;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 18px;
            }
            .message {
                margin: 12px 0;
                color: #ffd2d2;
                min-height: 1.5em;
            }
            .record-screen.active {
                display: flex;
                flex-direction: column;
                position: fixed;
                inset: 0;
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
                background: #000;
                isolation: isolate;
                z-index: 10;
            }
            .controls {
                position: relative;
                z-index: 30;
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 8px max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
                background: var(--panel);
                border-bottom: 1px solid var(--line);
                overflow-x: auto;
                overflow-y: hidden;
                white-space: nowrap;
                scrollbar-width: thin;
            }
            .controls label {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                color: var(--muted);
                font-size: 0.88rem;
                flex: none;
            }
            .controls input[type="range"] {
                width: 85px;
                accent-color: var(--accent);
            }
            .controls input[type="color"] {
                width: 42px;
                height: 44px;
                border: 0;
                background: transparent;
            }
            .controls select {
                min-height: 44px;
                padding: 6px;
                background: #2b343a;
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 8px;
            }
            .controls button {
                flex: none;
            }
            .stage {
                position: relative;
                flex: 1 1 0;
                min-height: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
            }
            .video-box {
                position: relative;
                max-width: 100%;
                max-height: 100%;
                overflow: hidden;
                background: #000;
            }
            .camera {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            .overlay {
                position: absolute;
                inset: 0;
                overflow: hidden;
                touch-action: none;
                cursor: grab;
                user-select: none;
            }
            .overlay.dragging {
                cursor: grabbing;
            }
            .scroller {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                will-change: transform;
            }
            .prompt {
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                line-height: 1.5;
                padding: 8px 14px;
                border-radius: 6px;
            }
            .badge {
                position: absolute;
                z-index: 25;
                bottom: max(14px, env(safe-area-inset-bottom));
                left: max(14px, env(safe-area-inset-left));
                background: #941f2b;
                color: #fff;
                border-radius: 100px;
                padding: 7px 14px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                display: none;
                gap: 8px;
                align-items: center;
                pointer-events: none;
            }
            .badge.on {
                display: flex;
            }
            .dot {
                width: 9px;
                height: 9px;
                background: #fff;
                border-radius: 50%;
            }
            .countdown {
                position: absolute;
                z-index: 35;
                inset: 0;
                background: #0009;
                display: none;
                align-items: center;
                justify-content: center;
                font-size: clamp(5rem, 20vw, 10rem);
                font-weight: 800;
                pointer-events: none;
            }
            .countdown.on {
                display: flex;
            }
            .result video {
                display: block;
                max-width: 100%;
                max-height: 65dvh;
                margin: auto;
                background: #000;
            }
            .tip {
                font-size: 0.8rem;
                color: var(--muted);
                padding: 7px 12px;
                background: var(--panel);
                text-align: center;
            }
            .footer {
                flex: 0 0 auto;
                z-index: 30;
                background: var(--panel);
                border-top: 1px solid var(--line);
                padding: 8px max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom))
                    max(10px, env(safe-area-inset-left));
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }
            .footer button {
                min-width: 100px;
            }
            .hidden {
                display: none !important;
            }
            @media (max-width: 650px) {
                .controls {
                    gap: 10px;
                }
                .controls label {
                    font-size: 0.85rem;
                }
                .editor,
                .result {
                    padding: 20px 14px 36px;
                }
                .footer button {
                    flex: 1;
                }
                .tip {
                    font-size: 0.75rem;
                }
            }
            /* La vista de grabación es una capa fija: impide desplazar el documento por detrás.
   Solo el guion se mueve dentro de .overlay y solo los ajustes se desplazan horizontalmente. */
            html.recording-view,
            html.recording-view body {
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
            }
            .record-screen.active {
                position: fixed !important;
                inset: 0 !important;
                height: 100dvh !important;
                min-height: 0;
                overflow: hidden !important;
                overscroll-behavior: none;
            }
            .stage,
            .video-box,
            .overlay {
                overscroll-behavior: none;
            }
            .controls {
                overscroll-behavior-x: contain;
                touch-action: pan-x;
            }
            @media (max-width: 650px) {
                .tip {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <section id="editor" class="screen editor active">
                <h1>Teleprompter</h1>
                <p>Tu guion solo se muestra sobre la vista previa; el vídeo se graba sin texto.</p>
                <label for="script">Guion</label
                ><textarea id="script" placeholder="Escribe aquí lo que vas a leer…"></textarea>
                <div class="grid">
                    <label class="setting"
                        >Cuenta atrás: <output id="countVal">5 s</output
                        ><input id="countSec" type="range" min="0" max="10" value="5"
                    /></label>
                    <label class="setting"
                        >Velocidad: <output id="speedVal">55 px/s</output
                        ><input id="speed" type="range" min="5" max="250" value="55"
                    /></label>
                    <label class="setting"
                        >Posición inicial<select id="position">
                            <option value="bottom">Abajo</option>
                            <option value="middle" selected>Centro</option>
                            <option value="top">Arriba</option>
                        </select></label
                    >
                </div>
                <button id="continue" class="primary">Continuar</button>
                <p id="editorError" class="message" role="alert"></p>
            </section>
            <section id="record" class="screen record-screen" aria-label="Vista de grabación">
                <div class="controls" aria-label="Ajustes del teleprompter">
                    <label
                        >Velocidad <input id="liveSpeed" type="range" min="5" max="250" value="55" /><output
                            id="liveSpeedVal"
                            >55</output
                        ></label
                    >
                    <label
                        >Tamaño <input id="fontSize" type="range" min="16" max="72" value="32" /><output id="fontVal"
                            >32</output
                        ></label
                    >
                    <label>Texto <input id="textColor" type="color" value="#ffffff" /></label>
                    <label>Fondo <input id="bgColor" type="color" value="#000000" /></label>
                    <label
                        >Opacidad <input id="opacity" type="range" min="0" max="100" value="60" /><output
                            id="opacityVal"
                            >60%</output
                        ></label
                    >
                    <label
                        >Posición
                        <select id="livePosition">
                            <option value="bottom">Abajo</option>
                            <option value="middle" selected>Centro</option>
                            <option value="top">Arriba</option>
                        </select></label
                    >
                </div>
                <div id="stage" class="stage">
                    <div id="videoBox" class="video-box">
                        <video id="camera" class="camera" autoplay muted playsinline></video>
                        <div id="overlay" class="overlay">
                            <div id="scroller" class="scroller"><div id="prompt" class="prompt"></div></div>
                        </div>
                    </div>
                    <div id="countdown" class="countdown"></div>
                    <div id="badge" class="badge"><span class="dot"></span>REC <span id="timer">00:00</span></div>
                </div>
                <div class="tip">
                    Mantén pulsado para detener el texto; arrastra para reposicionarlo. Se reanuda al soltar.
                </div>
                <div class="footer">
                    <button id="back">Volver</button><button id="start" class="primary">Grabar</button
                    ><button id="stop" class="danger" disabled>Detener</button>
                </div>
            </section>
            <section id="result" class="screen result">
                <h1>Grabación terminada</h1>
                <p id="resultMessage"></p>
                <video id="playback" controls playsinline></video>
                <div class="row">
                    <button id="download" class="primary">Descargar</button><button id="retake">Volver a grabar</button
                    ><button id="new">Nuevo guion</button>
                </div>
                <p id="resultError" class="message" role="alert"></p>
            </section>
        </main>
        <script>
            (function () {
                "use strict";
                const $ = (id) => document.getElementById(id),
                    el = {
                        editor: $("editor"),
                        record: $("record"),
                        result: $("result"),
                        script: $("script"),
                        camera: $("camera"),
                        stage: $("stage"),
                        videoBox: $("videoBox"),
                        overlay: $("overlay"),
                        scroller: $("scroller"),
                        prompt: $("prompt"),
                        badge: $("badge"),
                        timer: $("timer"),
                        countdown: $("countdown"),
                        playback: $("playback"),
                    };
                let stream = null,
                    recorder = null,
                    chunks = [],
                    writer = null,
                    fileHandle = null,
                    writeQueue = Promise.resolve(),
                    writingToDisk = false,
                    recordState = "idle",
                    raf = 0,
                    lastFrame = 0,
                    offset = 0,
                    pointerId = null,
                    pointerY = 0,
                    timerId = 0,
                    startTime = 0,
                    blobURL = null,
                    outputType = "",
                    pickerExt = "",
                    countdownId = 0;
                function view(name) {
                    for (const k of ["editor", "record", "result"]) el[k].classList.toggle("active", k === name);
                    document.documentElement.classList.toggle("recording-view", name === "record");
                    if (name === "record") window.scrollTo(0, 0);
                }
                function error(id, message) {
                    $(id).textContent = message || "";
                }
                function stopTracks() {
                    if (stream) {
                        stream.getTracks().forEach((track) => track.stop());
                        stream = null;
                    }
                    el.camera.srcObject = null;
                }
                function fitVideo() {
                    const w = el.stage.clientWidth,
                        h = el.stage.clientHeight,
                        vw = el.camera.videoWidth || w,
                        vh = el.camera.videoHeight || h;
                    if (!w || !h) return;
                    const scale = Math.min(w / vw, h / vh);
                    el.videoBox.style.width = Math.floor(vw * scale) + "px";
                    el.videoBox.style.height = Math.floor(vh * scale) + "px";
                    placeText();
                }
                function origin() {
                    const h = el.overlay.clientHeight;
                    const lh = parseFloat(getComputedStyle(el.prompt).lineHeight) || 48;
                    const pad = parseFloat(getComputedStyle(el.prompt).paddingTop) || 8;
                    const p = $("livePosition").value;
                    return p === "bottom" ? h - (lh + pad) : p === "middle" ? Math.max(0, h / 2 - lh / 2 - pad) : 0;
                }
                function placeText() {
                    el.scroller.style.transform = "translate3d(0," + (origin() - offset) + "px,0)";
                }
                function styleText() {
                    el.prompt.style.fontSize = $("fontSize").value + "px";
                    el.prompt.style.color = $("textColor").value;
                    const hex = $("bgColor").value;
                    const rgb = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(",");
                    el.prompt.style.backgroundColor = "rgba(" + rgb + "," + Number($("opacity").value) / 100 + ")";
                    $("fontVal").value = $("fontSize").value;
                    $("opacityVal").value = $("opacity").value + "%";
                    placeText();
                }
                function tick(t) {
                    if (recordState === "recording" && pointerId === null) {
                        const dt = lastFrame ? Math.min((t - lastFrame) / 1000, 0.1) : 0;
                        offset += Number($("liveSpeed").value) * dt;
                        placeText();
                    }
                    lastFrame = t;
                    raf = requestAnimationFrame(tick);
                }
                function startLoop() {
                    cancelAnimationFrame(raf);
                    lastFrame = 0;
                    raf = requestAnimationFrame(tick);
                }
                function stopLoop() {
                    cancelAnimationFrame(raf);
                    raf = 0;
                    lastFrame = 0;
                }
                function timeDisplay() {
                    let s = Math.floor((Date.now() - startTime) / 1000),
                        h = Math.floor(s / 3600),
                        m = Math.floor((s % 3600) / 60);
                    el.timer.textContent =
                        (h ? String(h).padStart(2, "0") + ":" : "") +
                        String(m).padStart(2, "0") +
                        ":" +
                        String(s % 60).padStart(2, "0");
                }
                function timeStop() {
                    clearInterval(timerId);
                    timerId = 0;
                    el.badge.classList.remove("on");
                }
                function mime() {
                    if (!window.MediaRecorder) return null;
                    for (const t of [
                        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
                        "video/mp4",
                        "video/webm;codecs=vp8,opus",
                        "video/webm",
                    ])
                        if (MediaRecorder.isTypeSupported(t)) return t;
                    return "";
                }
                async function acquire() {
                    if (!navigator.mediaDevices?.getUserMedia)
                        throw Error("Necesitas HTTPS o localhost y un navegador con cámara.");
                    const s = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: true,
                    });
                    stream = s;
                    el.camera.srcObject = s;
                    await el.camera.play().catch(() => {});
                    requestAnimationFrame(fitVideo);
                }
                function resetShot() {
                    offset = 0;
                    recordState = "idle";
                    lastFrame = 0;
                    el.timer.textContent = "00:00";
                    el.badge.classList.remove("on");
                    $("start").disabled = false;
                    $("stop").disabled = true;
                    el.countdown.classList.remove("on");
                    placeText();
                }
                async function goPreview() {
                    error("editorError", "");
                    $("continue").disabled = true;
                    try {
                        await acquire();
                        el.prompt.textContent = el.script.value;
                        $("livePosition").value = $("position").value;
                        $("liveSpeed").value = $("speed").value;
                        $("liveSpeedVal").value = $("liveSpeed").value;
                        styleText();
                        resetShot();
                        view("record");
                        fitVideo();
                        startLoop();
                    } catch (e) {
                        stopTracks();
                        error("editorError", e.message || "No se pudo abrir la cámara.");
                    } finally {
                        $("continue").disabled = false;
                    }
                }
                $("continue").onclick = () => {
                    if (!el.script.value.trim()) {
                        error("editorError", "Introduce el guion antes de continuar.");
                        return;
                    }
                    goPreview();
                };
                $("countSec").oninput = () => ($("countVal").value = $("countSec").value + " s");
                $("speed").oninput = () => {
                    $("speedVal").value = $("speed").value + " px/s";
                    $("liveSpeed").value = $("speed").value;
                    $("liveSpeedVal").value = $("speed").value;
                };
                $("liveSpeed").oninput = () => {
                    $("liveSpeedVal").value = $("liveSpeed").value;
                    $("speed").value = $("liveSpeed").value;
                    $("speedVal").value = $("speed").value + " px/s";
                };
                ["fontSize", "textColor", "bgColor", "opacity"].forEach((id) =>
                    $(id).addEventListener("input", styleText)
                );
                $("livePosition").onchange = () => {
                    $("position").value = $("livePosition").value;
                    offset = 0;
                    placeText();
                };
                $("back").onclick = () => {
                    if (recordState !== "idle") return;
                    stopLoop();
                    stopTracks();
                    view("editor");
                };
                el.overlay.onpointerdown = (e) => {
                    if (recordState !== "recording") return;
                    pointerId = e.pointerId;
                    pointerY = e.clientY;
                    el.overlay.setPointerCapture(e.pointerId);
                    el.overlay.classList.add("dragging");
                    e.preventDefault();
                };
                el.overlay.onpointermove = (e) => {
                    if (pointerId !== e.pointerId) return;
                    const delta = e.clientY - pointerY;
                    offset = Math.max(-el.overlay.clientHeight, offset - delta);
                    pointerY = e.clientY;
                    placeText();
                    e.preventDefault();
                };
                function pointerEnd(e) {
                    if (pointerId !== e.pointerId) return;
                    pointerId = null;
                    el.overlay.classList.remove("dragging");
                    lastFrame = 0;
                    placeText();
                }
                el.overlay.onpointerup = pointerEnd;
                el.overlay.onpointercancel = pointerEnd;
                async function startRecord() {
                    if (recordState !== "idle") return;
                    recordState = "countdown";
                    $("start").disabled = true;
                    $("back").disabled = true;
                    const seconds = Number($("countSec").value);
                    try {
                        const supported = mime();
                        if (supported === null) throw Error("Este navegador no permite grabar vídeo.");
                        outputType = supported || "video/webm";
                        pickerExt = outputType.includes("mp4") ? "mp4" : "webm";
                        chunks = [];
                        writer = null;
                        fileHandle = null;
                        writingToDisk = false;
                        writeQueue = Promise.resolve();
                        if (window.showSaveFilePicker) {
                            try {
                                fileHandle = await window.showSaveFilePicker({
                                    suggestedName: "teleprompter." + pickerExt,
                                    types: [
                                        {
                                            description: "Vídeo " + pickerExt.toUpperCase(),
                                            accept: {
                                                [pickerExt === "mp4" ? "video/mp4" : "video/webm"]: ["." + pickerExt],
                                            },
                                        },
                                    ],
                                });
                                writer = await fileHandle.createWritable();
                                writingToDisk = true;
                            } catch (e) {
                                if (e.name === "AbortError") {
                                    recordState = "idle";
                                    $("start").disabled = false;
                                    $("back").disabled = false;
                                    return;
                                }
                                throw e;
                            }
                        }
                        if (seconds) {
                            el.countdown.classList.add("on");
                            for (let i = seconds; i > 0; i--) {
                                el.countdown.textContent = i;
                                await new Promise((resolve) => {
                                    countdownId = setTimeout(resolve, 1000);
                                });
                                if (recordState !== "countdown") return;
                            }
                            el.countdown.classList.remove("on");
                        }
                        offset = 0;
                        placeText();
                        const opts = supported
                            ? { mimeType: supported, videoBitsPerSecond: 2500000 }
                            : { videoBitsPerSecond: 2500000 };
                        recorder = new MediaRecorder(stream, opts);
                        recorder.ondataavailable = (e) => {
                            if (!e.data?.size) return;
                            if (writingToDisk) {
                                const data = e.data;
                                writeQueue = writeQueue
                                    .then(() => writer.write(data))
                                    .catch((err) => {
                                        error("resultError", "Fallo al guardar el vídeo: " + err.message);
                                        if (recorder?.state === "recording") stopRecord();
                                    });
                            } else chunks.push(e.data);
                        };
                        recorder.onerror = (e) => {
                            error("resultError", "Error del grabador: " + (e.error?.message || "desconocido"));
                            if (recorder?.state !== "inactive") recorder.stop();
                        };
                        recorder.onstop = finishRecord;
                        recorder.start(2000);
                        recordState = "recording";
                        startTime = Date.now();
                        timeDisplay();
                        timerId = setInterval(timeDisplay, 500);
                        el.badge.classList.add("on");
                        $("stop").disabled = false;
                    } catch (e) {
                        recordState = "idle";
                        el.countdown.classList.remove("on");
                        $("start").disabled = false;
                        $("back").disabled = false;
                        if (writer) {
                            try {
                                await writer.abort();
                            } catch (_) {}
                        }
                        writer = null;
                        error("editorError", e.message || "No se pudo iniciar la grabación.");
                        alert(e.message || "No se pudo iniciar la grabación.");
                    }
                }
                function stopRecord() {
                    if (recordState !== "recording") return;
                    recordState = "stopping";
                    $("stop").disabled = true;
                    timeStop();
                    try {
                        recorder.stop();
                    } catch (e) {
                        error("resultError", e.message);
                    }
                }
                async function finishRecord() {
                    stopLoop();
                    timeStop();
                    stopTracks();
                    $("back").disabled = false;
                    recordState = "idle";
                    const wasDisk = writingToDisk;
                    try {
                        if (wasDisk) {
                            await writeQueue;
                            await writer.close();
                            writer = null;
                            $("resultMessage").textContent = "Vídeo guardado en la ubicación que elegiste.";
                            el.playback.classList.add("hidden");
                            $("download").classList.add("hidden");
                        } else {
                            const blob = new Blob(chunks, { type: recorder?.mimeType || outputType });
                            if (!blob.size) throw Error("El vídeo está vacío.");
                            if (blobURL) URL.revokeObjectURL(blobURL);
                            blobURL = URL.createObjectURL(blob);
                            el.playback.src = blobURL;
                            el.playback.classList.remove("hidden");
                            $("download").classList.remove("hidden");
                            $("resultMessage").textContent = "Puedes revisar y descargar tu grabación.";
                        }
                    } catch (e) {
                        error("resultError", "No se pudo finalizar: " + e.message);
                        $("resultMessage").textContent = "La grabación no se ha podido guardar por completo.";
                        el.playback.classList.add("hidden");
                        $("download").classList.add("hidden");
                    } finally {
                        writingToDisk = false;
                        chunks = [];
                        view("result");
                    }
                }
                $("start").onclick = startRecord;
                $("stop").onclick = stopRecord;
                $("download").onclick = () => {
                    if (!blobURL) return;
                    const a = document.createElement("a");
                    a.href = blobURL;
                    a.download = "teleprompter." + pickerExt;
                    a.click();
                };
                $("retake").onclick = async () => {
                    error("resultError", "");
                    $("retake").disabled = true;
                    try {
                        await acquire();
                        el.prompt.textContent = el.script.value;
                        resetShot();
                        view("record");
                        fitVideo();
                        startLoop();
                    } catch (e) {
                        stopTracks();
                        error("resultError", "No se pudo reabrir la cámara: " + e.message);
                    } finally {
                        $("retake").disabled = false;
                    }
                };
                $("new").onclick = () => {
                    stopTracks();
                    el.script.value = "";
                    view("editor");
                };
                new ResizeObserver(fitVideo).observe(el.stage);
            })();
        </script>
    </body>
</html>
